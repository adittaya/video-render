/* ---------- maths ---------- */
function clamp01(x){ return x<0?0:(x>1?1:x); }
function seg(t,a,b){ return clamp01((t-a)/(b-a)); }
function mix(a,b,k){ k=clamp01(k); return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]; }
function rgb(c){ return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }
function rgba(c,a){ return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')'; }
/* elegant easing: long, sculpted deceleration, no bounce */
function eOut(x){ x=clamp01(x); return 1-Math.pow(1-x,4); }
function eInOut(x){ x=clamp01(x); return x<0.5 ? 8*x*x*x*x : 1-Math.pow(-2*x+2,4)/2; }
function eIn(x){ x=clamp01(x); return x*x*x; }

function spectrum(t){
  t=((t%1)+1)%1; var n=SPEC.length-1, x=t*n, i=Math.min(n-1,Math.floor(x)), f=x-i;
  return mix(SPEC[i],SPEC[i+1],f);
}

  '  vec2 uv=(gl_FragCoord.xy-uCentre)/uRes.y*2.0-vec2(uOffX,uOffY);',
  '  float R='+SPHERE_R+'*uPresence;',
  '  vec3 ro=vec3(0.0,0.0,3.0); vec3 rd=normalize(vec3(uv,-1.55));',
  '  float b=dot(ro,rd), c=dot(ro,ro)-R*R, h=b*b-c;',
  '  vec3 col=vec3(0.0); float alpha=0.0;',
  '  if(h>0.0){',
  '    float d=-b-sqrt(h); vec3 p=ro+rd*d; vec3 N=normalize(p/R);',
  '    float imp=(fbm(N*7.0)-0.5)*0.020;',
  '    N=normalize(N+imp);',
  '    float fres=pow(1.0-clamp(dot(N,-rd),0.0,1.0),4.0);',
  '    vec3 Rv=reflect(rd,N);',
  '    float ca=cos(uEnvRot), sa=sin(uEnvRot);',
  '    Rv=vec3(ca*Rv.x-sa*Rv.z, Rv.y, sa*Rv.x+ca*Rv.z);',
  '    vec3 refl=env(Rv);',
  '    vec3 ks=normalize(vec3(-0.62+1.45*uSweep,0.52,0.62));',
  '    float sweep=pow(max(dot(N,ks),0.0),46.0)*0.50;',
  '    float spec=pow(max(dot(N,normalize(vec3(-0.50,0.80,0.45))),0.0),430.0)*2.10;',
  '    float spec2=pow(max(dot(N,normalize(vec3(0.78,0.18,0.50))),0.0),110.0)*0.42;',
  '    float thick=2.0*sqrt(h);',
  '    col=vec3(0.016,0.018,0.028)',
  '      + refl*0.95',
  '      + fres*vec3(0.58,0.72,0.96)*0.62',
  '      + spec*vec3(1.0)',
  '      + spec2*vec3(0.62,0.76,1.0)*0.50',
  '      + sweep*vec3(0.80,0.88,1.00);',
  '    col*=1.0-0.34*smoothstep(0.25,1.65,thick)*(1.0-fres);',
  '    float core=exp(-thick*1.15);',
  '    float inN=fbm(N*1.55+vec3(0.0,uTime*0.10,uTime*0.06));',
  '    vec3 innerTint=mix(vec3(0.34,0.54,1.0), vec3(0.95,0.70,0.46), inN*0.55);',
  '    col+=innerTint*core*(0.03+0.10*uInner);',
  '    col+=fres*vec3(0.66,0.78,0.98)*0.16*uInner;',
  '    alpha=1.0;',
  '  } else {',
  '    float dd=length(uv)-R;',
  '    float g=exp(-max(dd,0.0)*9.5)*0.13;',
  '    col=vec3(0.42,0.55,0.82)*g; alpha=g;',
  '  }',
  '  col*=(1.0-uExit*0.92); alpha*=(1.0-uExit*0.92);',
  '  col=clamp(col,0.0,6.0);',
  '  col=(col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);',
  '  col+=hash(vec3(gl_FragCoord.xy,floor(uTime*24.0)))*0.016-0.008;',
  /* on the light phase it settles as smoked glass on white */
  '  col=mix(col, col*0.52+vec3(0.26,0.27,0.30), uLift*0.60);',
  '  gl_FragColor=vec4(col,clamp(alpha,0.0,1.0));',
  '}'].join('\n');
  function sh(ty,src){ var o=gl.createShader(ty); gl.shaderSource(o,src); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){ window.__orbErr=gl.getShaderInfoLog(o); return null; } return o; }
  var v=sh(gl.VERTEX_SHADER,VS), f=sh(gl.FRAGMENT_SHADER,FS);
  if(!v||!f) return;
  var pr=gl.createProgram(); gl.attachShader(pr,v); gl.attachShader(pr,f); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  var bf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  ['uRes','uCentre','uTime','uPresence','uSweep','uLift','uExit','uEnvRot','uInner','uOffX','uOffY'].forEach(function(n){ orbU[n]=gl.getUniformLocation(pr,n); });
  orbGL=gl; orbProg=pr; orbOK=true;
})();
function renderOrb(pres,sweep,lift,exit,time,envRot,inner,ox,oy){
  if(!orbOK) return;
  var gl=orbGL;
  gl.viewport(0,0,orbCv.width,orbCv.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(orbProg);
  gl.uniform2f(orbU.uRes,orbCv.width,orbCv.height);
  gl.uniform2f(orbU.uCentre,CX,orbCv.height-CY);   /* gl_FragCoord is bottom-up */
  gl.uniform1f(orbU.uTime,time); gl.uniform1f(orbU.uPresence,pres);
  gl.uniform1f(orbU.uSweep,sweep); gl.uniform1f(orbU.uLift,lift);
  gl.uniform1f(orbU.uExit,exit);
  gl.uniform1f(orbU.uEnvRot,envRot||0); gl.uniform1f(orbU.uInner,inner||0);
  gl.uniform1f(orbU.uOffX,ox||0); gl.uniform1f(orbU.uOffY,oy||0);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------- official marks ---------- */
function tint(img,colour){
  var o=document.createElement('canvas'); o.width=img.width; o.height=img.height;
  var g=o.getContext('2d'); g.drawImage(img,0,0);
  g.globalCompositeOperation='source-in'; g.fillStyle=colour;
  g.fillRect(0,0,o.width,o.height); return o;
}
var MK={white:null,ink:null}, WD={white:null,ink:null}, ready=0;
cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality='high';
function load(uri,store){
  var im=new Image();
  im.onload=function(){ store.white=tint(im,'#ffffff'); store.ink=tint(im,'#121317');
                        ready++; if(ready>=2) extractBoundary(); };
  im.src=uri;
}
load(MARK_URI,MK); load(WORD_URI,WD);

/* ---------- emblem silhouette -> filament targets ---------- */
var BOUNDARY=[];
function extractBoundary(){
  var w=96,h=95;
  var oc=document.createElement('canvas'); oc.width=w; oc.height=h;
  var g=oc.getContext('2d'); g.drawImage(MK.ink,0,0,w,h);
  var d=g.getImageData(0,0,w,h).data, pts=[];
  for(var y=1;y<h-1;y++) for(var x=1;x<w-1;x++){
    if(d[(y*w+x)*4+3]<=128) continue;
    var edge=false, nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var k=0;k<4;k++){ var j=((y+nb[k][1])*w+(x+nb[k][0]))*4; if(d[j+3]<=128){ edge=true; break; } }
    if(edge) pts.push({x:x-48+CX, y:y-47.5+CY});
  }
  var step=Math.max(1,Math.floor(pts.length/72));
  BOUNDARY=[]; for(var m=0;m<pts.length;m+=step) BOUNDARY.push(pts[m]);
  BOUNDARY.sort(function(a,b){
    return Math.atan2(a.y-CY,a.x-CX)-Math.atan2(b.y-CY,b.x-CX);
  });
  window.__filaments=BOUNDARY.length;
}

/* ---------- finishing (restrained) ---------- */
var grainTile=null, gradeCv=null, gradeCx=null, bloomCv=null, bloomCx=null;
function RNG(seed){ this.s=seed>>>0; }
RNG.prototype.next=function(){ this.s=(this.s*1664525+1013904223)>>>0; return this.s/4294967296; };
function makeGrain(size,seed){
  var c=document.createElement('canvas'); c.width=c.height=size;
  var g=c.getContext('2d'); var img=g.createImageData(size,size); var rnd=new RNG(seed);
  function grid(n){ var a=new Float32Array(n*n); for(var i=0;i<n*n;i++) a[i]=rnd.next(); return a; }
  function samp(a,n,x,y){
    var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    var u=xf*xf*xf*(xf*(xf*6-15)+10), v=yf*yf*yf*(yf*(yf*6-15)+10);
    var at=function(i,j){ return a[(((j%n)+n)%n)*n+(((i%n)+n)%n)]; };
    return (at(xi,yi)*(1-u)+at(xi+1,yi)*u)*(1-v)+(at(xi,yi+1)*(1-u)+at(xi+1,yi+1)*u)*v;
  }
  var g1=grid(48), g2=grid(96), g3=grid(192);
  for(var y=0;y<size;y++) for(var x=0;x<size;x++){
    var n=samp(g1,48,x/size*48,y/size*48)*0.50+samp(g2,96,x/size*96,y/size*96)*0.32+samp(g3,192,x/size*192,y/size*192)*0.18;
    var l=(n-0.5)*2, i=(y*size+x)*4, ch=(rnd.next()-0.5)*0.11;
    img.data[i]=128+l*127+ch*127; img.data[i+1]=128+l*127; img.data[i+2]=128+l*127-ch*127; img.data[i+3]=255;
  }
  g.putImageData(img,0,0); return c;
}
function initFinish(){
  grainTile=makeGrain(512,987654321);
  gradeCv=document.createElement('canvas'); gradeCv.width=1280; gradeCv.height=720;
  gradeCx=gradeCv.getContext('2d');
  bloomCv=document.createElement('canvas'); bloomCv.width=320; bloomCv.height=180;
  bloomCx=bloomCv.getContext('2d');
}
initFinish();
function drawGrain(alpha,frame){
  if(!grainTile) return;
  var ox=((frame*97)%512), oy=((frame*61)%512);
  cx.save(); cx.globalCompositeOperation='overlay'; cx.globalAlpha=alpha;
  for(var y=-oy;y<720;y+=512) for(var x=-ox;x<1280;x+=512) cx.drawImage(grainTile,x,y);
  cx.restore();
}
function finishPass(t){
  if(bloomCx){                                   /* whisper of bloom only */
    bloomCx.clearRect(0,0,320,180); bloomCx.drawImage(cv,0,0,320,180);
    cx.save(); cx.globalCompositeOperation='screen'; cx.globalAlpha=0.045;
    cx.filter='blur(7px) brightness(1.1)';
    cx.drawImage(bloomCv,0,0,1280,720); cx.filter='none'; cx.restore();
  }
  if(gradeCx){                                   /* gentle, no overexposure */
    gradeCx.clearRect(0,0,1280,720); gradeCx.drawImage(cv,0,0);
    cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,1280,720);
    cx.filter='contrast(1.10) saturate(1.06) brightness(1.005)';
    cx.drawImage(gradeCv,0,0); cx.filter='none';
  }
  drawGrain(0.032, Math.floor(t*30));
  cx.save(); cx.globalCompositeOperation='screen'; cx.globalAlpha=0.014;
  var gx2=((Math.floor(t*30)*151)%512), gy2=((Math.floor(t*30)*83)%512);
  for(var gy=-gy2;gy<720;gy+=512) for(var gx=-gx2;gx<1280;gx+=512) cx.drawImage(grainTile,gx,gy);
  cx.restore();
}

/* =====================================================================
   TIMELINE  (10.0 s, 16:9 — unchanged duration & aspect)
   0.0-1.3   obsidian sphere resolves out of the dark, rim ignites
   1.3-2.6   key light sweeps the surface  (material moment)
   2.6-5.2   light filaments leave the sphere and converge into the emblem
   5.2-6.2   emblem complete, sphere recedes, wordmark eases in
   6.2-7.2   tagline eases in
   7.2-8.5   deliberate transition to the light background
   8.5-10.0  HOLD the final frame
   ===================================================================== */
function draw(t){
  /* ---------------- timeline ---------------- */
  var pres   = eOut(seg(t,0.15,1.30));
  var sweep  = eInOut(seg(t,1.30,2.60));
  var inner  = (0.22+0.78*eOut(seg(t,0.80,3.00)))*(1-eOut(seg(t,5.20,6.60))*0.55);
  var fl     = seg(t,2.60,5.10);
  var embl   = eOut(seg(t,3.30,5.20));
  var recede = eOut(seg(t,5.20,6.20));
  var word   = eOut(seg(t,5.30,6.20));
  var tagp   = eOut(seg(t,6.20,7.20));
  var wash   = eInOut(seg(t,7.15,8.60));   /* the light transition IS the sphere's light */
  var lift   = wash;
  var exit   = eInOut(seg(t,7.30,8.40));

  /* ---------------- elegant sphere life ---------------- */
  var bx  = Math.sin(t*0.55)*5.5;          /* slow float, px */
  var by  = Math.sin(t*0.42+1.2)*4.5;
  var br  = 1.0 + 0.012*Math.sin(t*0.72);  /* barely-there breath */
  var envRot = t*0.055;                    /* reflections drift across the surface */

  cx.setTransform(1,0,0,1,0,0);

  /* ---------------- background: smooth studio void ---------------- */
  var cIn  = mix([17,20,29],[251,251,248], lift);
  var cMid = mix([11,13,19],[240,241,241], lift);
  var cOut = mix([5,6,9],   [226,227,228], lift);
  var tint = spectrum(0.12+0.50*lift);
  cOut=mix(cOut,tint,0.035+0.045*lift);
  cIn =mix(cIn, tint,0.010+0.020*lift);
  var gb=cx.createRadialGradient(CX,CY-70,40, CX,CY+90,900);
  gb.addColorStop(0.00,rgb(cIn));
  gb.addColorStop(0.45,rgb(cMid));
  gb.addColorStop(1.00,rgb(cOut));
  cx.fillStyle=gb; cx.fillRect(0,0,1280,720);

  /* ---------------- camera: one slow, purposeful push-in ---------------- */
  var sc=(1.0+0.035*eOut(seg(t,0.6,6.4)))*br;
  cx.translate(CX,CY); cx.scale(sc,sc); cx.translate(-CX,-CY);

  /* ---------------- obsidian sphere (drifts via its own offset) ---------------- */
  var spOp=pres*(1-recede*0.5);
  renderOrb(pres*(1-recede*0.18), sweep, lift, exit, t, envRot, inner, bx/360, -by/360);
  if(orbOK){ cx.save(); cx.globalAlpha=spOp; cx.drawImage(orbCv,0,0); cx.restore(); }

  /* ---------------- motivated light transition ---------------- */
  if(wash>0.001){
    var wr=110+wash*1250;
    var wg=cx.createRadialGradient(CX,CY,0, CX,CY,wr);
    wg.addColorStop(0.0,'rgba(255,253,249,'+(0.98*wash).toFixed(3)+')');
    wg.addColorStop(0.5,'rgba(247,248,252,'+(0.80*wash).toFixed(3)+')');
    wg.addColorStop(1.0,'rgba(242,244,249,0)');
    cx.fillStyle=wg; cx.fillRect(0,0,1280,720);
  }

  /* ---------------- filaments: leave the sphere, assemble the emblem ---------------- */
  if(ready>=2 && BOUNDARY.length && fl>0.001 && fl<0.999){
    var Rs=projR(SPHERE_R)*(1-recede*0.18);
    var win=Math.sin(Math.PI*clamp01(fl))*0.85+0.15;
    cx.lineCap='round';
    for(var i=0;i<BOUNDARY.length;i++){
      var pt=BOUNDARY[i];
      var ang=Math.atan2(pt.y-CY, pt.x-CX);
      var sx=CX+Math.cos(ang)*Rs, sy=CY+Math.sin(ang)*Rs;
      var mx=(sx+pt.x)/2, my=(sy+pt.y)/2;
      var cxp=mx+Math.cos(ang)*26, cyp=my+Math.sin(ang)*26;
      var wave=(i/BOUNDARY.length)*0.55;
      var u=eInOut(clamp01((fl-wave)/(1-0.55)));
      if(u<=0.001) continue;
      var n=Math.max(2,Math.round(18*u));
      for(var s2=0;s2<n;s2++){
        var q0=(s2/18)*u, q1=((s2+1)/18)*u;
        var x0=(1-q0)*(1-q0)*sx+2*(1-q0)*q0*cxp+q0*q0*pt.x;
        var y0=(1-q0)*(1-q0)*sy+2*(1-q0)*q0*cyp+q0*q0*pt.y;
        var x1=(1-q1)*(1-q1)*sx+2*(1-q1)*q1*cxp+q1*q1*pt.x;
        var y1=(1-q1)*(1-q1)*sy+2*(1-q1)*q1*cyp+q1*q1*pt.y;
        var head=q1/Math.max(u,1e-3);
        var a=(0.05+0.30*head*head)*win*(1-u*0.35);
        cx.beginPath(); cx.moveTo(x0,y0); cx.lineTo(x1,y1);
        cx.strokeStyle='rgba(198,216,255,'+a.toFixed(3)+')';
        cx.lineWidth=0.6+0.7*head; cx.stroke();
      }
    }
  }

  /* ---------------- the emblem ASSEMBLES around the ring, slice by slice ---------------- */
  var mOp=embl;
  if(ready>=2 && mOp>0.004){
    var mDark = mix([255,255,255],[18,19,23], lift);
    if(embl>0.999){
      cx.save(); cx.globalAlpha=mOp;
      cx.drawImage(MK.ink, CX-48, CY-47.5, 96, 95);
      cx.restore();
      if(lift<0.995){
        cx.save(); cx.globalAlpha=mOp*(1-lift);
        cx.drawImage(MK.white, CX-48, CY-47.5, 96, 95); cx.restore();
      }
    } else {
      var NS=30, TAU=6.28318530718, stepA=TAU/NS;
      for(var s3=0;s3<NS;s3++){
        var su=eInOut(clamp01((fl-(s3/NS)*0.55)/(1-0.55)));
        if(su<=0.002) continue;
        var a0=-Math.PI+(s3/NS)*TAU-stepA*0.5;
        var a1=a0+stepA*2.0;                    /* overlap so seams never show */
        cx.save();
        cx.beginPath(); cx.moveTo(CX,CY); cx.arc(CX,CY,130,a0,a1); cx.closePath(); cx.clip();
        cx.globalAlpha=clamp01(su)*mOp*0.62;
        cx.drawImage(MK.ink, CX-48, CY-47.5, 96, 95);
        cx.restore();
        if(lift<0.995){
          cx.save();
          cx.beginPath(); cx.moveTo(CX,CY); cx.arc(CX,CY,130,a0,a1); cx.closePath(); cx.clip();
          cx.globalAlpha=clamp01(su)*mOp*0.62*(1-lift);
          cx.drawImage(MK.white, CX-48, CY-47.5, 96, 95);
          cx.restore();
        }
      }
    }
  }

  /* ---------------- wordmark: generous spacing, clean wipe ---------------- */
  if(ready>=2 && word>0.004){
    var wSc=1.0+0.045*(1-eOut(word));
    var wy=CY+154;
    var drawW=function(key,alpha){
      cx.save();
      cx.translate(CX,wy); cx.scale(wSc,wSc); cx.translate(-CX,-wy);
      cx.beginPath(); cx.rect(470, wy-32, 340*eOut(word), 64); cx.clip();
      cx.globalAlpha=alpha;
      cx.drawImage(key==='white'?WD.white:WD.ink, CX-101, wy-16, 202, 32);
      cx.restore();
    };
    drawW('ink', word);
    if(lift<0.995) drawW('white', word*(1-lift));
  }

  cx.setTransform(1,0,0,1,0,0);
  finishPass(t);

  /* ---------------- vignette: deepens the dark phase only ---------------- */
  var vg=cx.createRadialGradient(CX,CY-20,150, CX,CY+40,800);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,'+(0.20+0.32*(1-lift)).toFixed(3)+')');
  cx.fillStyle=vg; cx.fillRect(0,0,1280,720);

  /* ---------------- tagline ---------------- */
  tag.style.color=rgb(mix([214,218,230],[86,86,94], lift));
  tag.style.opacity=tagp.toFixed(3);
  tag.style.transform='translateY('+((1-eOut(tagp))*10).toFixed(2)+'px)';
}

var t=0, playing=true, last=0;
function loop(ms){
  if(!last) last=ms;
  var dt=(ms-last)/1000; last=ms;
  if(dt>0.1) dt=0.1;
  if(playing) t+=dt;
  if(t>TOTAL) t=0;
  draw(t);
  document.getElementById('scrub').value=t.toFixed(2);
  document.getElementById('tlabel').textContent=t.toFixed(2)+'s';
  requestAnimationFrame(loop);
}
var q=new URLSearchParams(location.search);
if(q.has('t')){ t=parseFloat(q.get('t'))||0; playing=false;
                document.getElementById('pp').textContent='Play'; }
requestAnimationFrame(loop);
document.getElementById('pp').onclick=function(){ playing=!playing; this.textContent=playing?'Pause':'Play'; };
document.getElementById('replay').onclick=function(){ t=0; };
document.getElementById('scrub').oninput=function(){ t=parseFloat(this.value); playing=false;
  document.getElementById('pp').textContent='Play'; };
})();
</script>
